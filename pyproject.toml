[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workstreams-cli"
version = "0.5.0"
description = "Visually dispatch coding-agent work to subagents in real terminal windows and monitor it in one dashboard - for any coding agent (Claude Code, Codex, OpenCode, Qwen Code, Hermes, Cline, and more)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dream-Pixels-Forge" }]
keywords = [
    "cli",
    "tmux",
    "zellij",
    "parallel",
    "subagents",
    "coding-agents",
    "claude-code",
    "codex",
    "opencode",
    "monitoring",
    "git-worktree",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pyyaml>=6.0", "pytest>=7.0"]

[project.scripts]
workstreams = "workstreams.cli:main"

[project.urls]
Homepage = "https://github.com/Dream-Pixels-Forge/workstreams-cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workstreams = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
