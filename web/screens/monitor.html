<div id="monitor-screen" class="screen-view">
          <div class="flex flex-col xl:flex-row gap-4">
            <div class="flex-1 min-w-0 space-y-4">
              <!-- Summary Metric Ribbons -->
              <div class="grid grid-cols-2 sm:grid-cols-3 2xl:grid-cols-5 gap-3">
                <div class="metric-ribbon">
                  <div class="metric-value text-3xl text-primary" id="total-workstreams">—</div>
                  <div class="metric-label text-caption mt-1">TOTAL WORKSTREAMS</div>
                </div>
                <div class="metric-ribbon">
                  <div class="metric-value text-3xl text-secondary" id="active-workstreams">—</div>
                  <div class="metric-label text-caption mt-1">ACTIVE</div>
                </div>
                <div class="metric-ribbon">
                  <div class="metric-value text-3xl text-success" id="clean-workstreams">—</div>
                  <div class="metric-label text-caption mt-1">CLEAN</div>
                </div>
                <div class="metric-ribbon">
                  <div class="metric-value text-3xl text-warning" id="dirty-workstreams">—</div>
                  <div class="metric-label text-caption mt-1">DIRTY</div>
                </div>
                <div class="metric-ribbon">
                  <div class="metric-value text-3xl text-danger" id="alerts">—</div>
                  <div class="metric-label text-caption mt-1">ALERTS</div>
                </div>
              </div>

              <!-- Workstreams Data Table -->
              <div class="panel">
                <div class="panel-head flex items-center justify-between">
                  <span>Workstreams Fleet Table</span>
                  <span class="font-normal normal-case tracking-normal text-caption">click a row to focus inspector</span>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead>
                      <tr class="border-b border-border bg-surface-high text-on-surface-variant">
                        <th class="text-left p-2 label-md font-bold">ID</th>
                        <th class="text-left p-2 label-md font-bold">WORKSTREAM / PATH</th>
                        <th class="text-left p-2 label-md font-bold">BRANCH</th>
                        <th class="text-left p-2 label-md font-bold">WORKER / PID</th>
                        <th class="text-left p-2 label-md font-bold">GIT STATE</th>
                        <th class="text-left p-2 label-md font-bold">LAST ACTIVITY</th>
                      </tr>
                    </thead>
                    <tbody id="monitor-tbody">
                      <tr><td colspan="6" class="p-2 text-on-surface-variant">Loading…</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Inspector & PTY Multiplexer Dock -->
              <div class="panel">
                <div class="flex border-b border-border" role="tablist" aria-label="Inspector">
                  <button type="button" data-inspect-tab="overview" class="tab-btn border-b-0" role="tab" aria-selected="true">Overview</button>
                  <button type="button" data-inspect-tab="terminal" class="tab-btn border-b-0" role="tab" aria-selected="false">Terminal Output</button>
                  <button type="button" data-inspect-tab="diff" class="tab-btn border-b-0" role="tab" aria-selected="false">Git Diff</button>
                  <button type="button" data-inspect-tab="worker" class="tab-btn border-b-0" role="tab" aria-selected="false">Worker Log</button>
                </div>
                <div class="p-3 min-h-48">
                  <div id="inspector-body" class="text-xs">
                    <p class="text-on-surface-variant">Loading…</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Live Subagent Activity Rail (340px) -->
            <aside class="w-full xl:w-[340px] shrink-0 space-y-4" aria-label="Activity rail">
              <div class="panel">
                <div class="panel-head">Subagent Activity</div>
                <div id="activity-rail" class="p-3 space-y-3 text-xs max-h-96 overflow-y-auto">
                  <p class="text-on-surface-variant">Loading…</p>
                </div>
              </div>
              <div class="panel">
                <div class="panel-head">Recent Alerts</div>
                <div id="alerts-rail" class="p-3 text-xs space-y-2 max-h-64 overflow-y-auto">
                  <p class="text-on-surface-variant">Loading…</p>
                </div>
              </div>
            </aside>
          </div>
        </div>
