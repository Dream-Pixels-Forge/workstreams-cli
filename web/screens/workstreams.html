<div id="workstreams-screen" class="screen-view hidden">
          <!-- Header Ribbon -->
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4 bg-surface-low border border-border px-4 py-3">
            <div class="flex flex-col gap-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="label-md text-on-surface">Workstreams Matrix &amp; Dispatch Control</span>
                <span class="label-md px-2 py-0.5 bg-primary-fixed text-on-primary-container" id="ws-running">—</span>
                <span class="label-md px-2 py-0.5 bg-surface-highest text-secondary">GIT WORKTREE ISOLATION</span>
              </div>
              <p class="text-xs text-on-surface-variant">Concurrent subagent fleet · live status from <span class="code-stream">/api/status</span></p>
            </div>
            <button id="dispatch-open" class="btn-primary">+ Dispatch New Workstream</button>
          </div>

          <!-- Dispatch Form (hidden until opened) -->
          <div id="dispatch-form" class="hidden panel mb-4">
            <div class="panel-head">Dispatch a subagent</div>
            <div class="p-4 space-y-3">
              <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                <label class="text-xs text-on-surface-variant">Workstream
                  <select id="dispatch-ws" class="mt-1 w-full border border-border bg-surface-lowest p-2 text-sm font-mono text-on-surface focus:border-primary-fixed focus:outline-none"></select>
                </label>
                <label class="text-xs text-on-surface-variant">Subagent <span class="text-danger">*</span>
                  <input id="dispatch-subagent" type="text" placeholder="claude-code" class="mt-1 w-full border border-border bg-surface-lowest p-2 text-sm font-mono text-on-surface placeholder:text-caption focus:border-primary-fixed focus:outline-none">
                </label>
                <label class="text-xs text-on-surface-variant">Issue number (optional)
                  <input id="dispatch-issue" type="number" min="0" placeholder="0" class="mt-1 w-full border border-border bg-surface-lowest p-2 text-sm font-mono text-on-surface placeholder:text-caption focus:border-primary-fixed focus:outline-none">
                </label>
                <label class="text-xs text-on-surface-variant">Agent override (optional)
                  <input id="dispatch-agent" type="text" placeholder="same as config" class="mt-1 w-full border border-border bg-surface-lowest p-2 text-sm font-mono text-on-surface placeholder:text-caption focus:border-primary-fixed focus:outline-none">
                </label>
              </div>
              <label class="block text-xs text-on-surface-variant">Prompt <span class="text-danger">*</span> (unless an issue number is given)
                <textarea id="dispatch-prompt" rows="3" placeholder="Describe the task…" class="mt-1 w-full border border-border bg-surface-lowest p-2 text-sm text-on-surface placeholder:text-caption focus:border-primary-fixed focus:outline-none"></textarea>
              </label>
              <button id="dispatch-submit" class="btn-primary">Dispatch</button>
              <p id="dispatch-result" class="text-xs mt-2"></p>
            </div>
          </div>

          <!-- Subagent Workstream Fleet Cards -->
          <div id="workstreams-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
            <p class="text-on-surface-variant text-sm">Loading…</p>
          </div>

          <!-- Bottom panels -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="panel">
              <div class="panel-head">Dispatch Timeline &amp; Conflict Radar</div>
              <div class="p-3">
                <div id="conflict-radar" class="mb-3 text-xs">
                  <p class="text-on-surface-variant">Loading…</p>
                </div>
                <div id="dispatch-timeline" class="text-xs space-y-2 max-h-56 overflow-y-auto">
                  <p class="text-on-surface-variant">Loading…</p>
                </div>
              </div>
            </div>
            <div class="panel">
              <div class="panel-head">Inter-Agent IPC Comets</div>
              <div id="ipc-stream" class="p-3 text-xs space-y-2 max-h-64 overflow-y-auto">
                <p class="text-on-surface-variant">Loading…</p>
              </div>
            </div>
          </div>
        </div>
