<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workstreams Web Console</title>
  <meta name="description" content="Live console for the workstreams CLI — dispatch subagents, monitor worktrees, events and config.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23b8ff47'/></svg>">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-surface text-on-surface font-mono">

  <!-- Top Utility Bar (56px height) -->
  <header class="sticky top-0 z-20 bg-surface-border border-b border-border flex items-center justify-between h-14 px-4 text-sm">
    <div class="relative flex items-center">
      <span class="select-none mr-2 text-muted-foreground" id="header-project">workstreams</span>
      <svg class="w-4 h-4 mx-1 text-muted-foreground opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h12m0 0l-4-4L5 8Zm8 0l4-4m0 0l-4 4m0 0l4 4"/>
      </svg>
    </div>
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded text-xs font-mono bg-surface-container/50 text-on-surface-container/80">
        <span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
        <span class="align-middle">● LIVE</span>
      </span>
      <span class="text-caption" id="header-updated">connecting…</span>
    </div>
    <button class="relative rounded-md p-1.5 hover:bg-surface-container focus-visible:outline focus-visible:outline-2 focus-visible:-outline-offset focus-visible:outline-primary" aria-label="Notifications">
      <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a2.032 2.032 0 011.421-1.825l1.41 1.41m0 0l-1.41 1.41A2.032 2.032 0 0114.158 11v3.158c0 .538-.21 1.043-.585 1.414L11.421 15.908A2.032 2.032 0 0111 13v3.158c0 .538-.21 1.043-.585 1.414zM10.5 7.032L11 8m0 0l-.999-.032L10 7.032m0 0l.999.032L11 8m-4.5 0a2.25 2.25 0 110-4.5 2.25 2.25 0 010 4.5z"/>
      </svg>
      <span class="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-primary ring-1 ring-primary/60"></span>
    </button>
    <div class="hidden w-8 h-8 rounded-full bg-gradient-to-br-primary/20 text-primary opacity-60">UH</div>
  </header>

  <!-- Left Navigation Rail (220px width) -->
  <aside class="fixed left-0 top-16 h-screen w-24 transition-transform duration-200 ease-in-out" aria-label="Main navigation">
    <div class="h-full flex flex-col items-center justify-between pt-6">
      <!-- Workstreams Wordmark Header -->
      <div class="w-full flex flex-col items-center gap-2 text-xs uppercase tracking-widest">
        <span class="text-primary">workstreams</span>
        <span class="hidden sm:block text-on-surface-container tracking-normal">CLI Orchestrator</span>
      </div>

      <!-- Primary Navigation Links -->
      <nav class="w-full flex flex-col gap-1 my-4">
        <button data-nav="monitor" class="w-full flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium opacity-60 hover:text-primary transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10Z"/>
          </svg>
          <span class="hidden sm:block">Monitor</span>
        </button>

        <button data-nav="events" class="w-full flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium opacity-60 hover:text-primary transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h.5l-.5 8.5a2 2 0 01-1.987 2.18l-2.56-2.38zM15 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h.5l-.5 8.5a2 2 0 01-1.987 2.18l-2.56-2.38z"/>
          </svg>
          <span class="hidden sm:block">Events</span>
        </button>

        <button data-nav="workstreams" class="w-full flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium opacity-60 hover:text-primary transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h.5l-.5 8.5a2 2 0 01-1.987 2.18l-2.56-2.38zM15 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h.5l-.5 8.5a2 2 0 01-1.987 2.18l-2.56-2.38z"/>
          </svg>
          <span class="hidden sm:block">Workstreams</span>
        </button>

        <button data-nav="settings" class="w-full flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium opacity-60 hover:text-primary transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 7a4 4 0 014 4v.5m0 0a3 3 0 00-6 0V7a4 4 0 014-4z"/>
          </svg>
          <span class="hidden sm:block">Settings</span>
        </button>
      </nav>

      <!-- Footer Link -->
      <div class="text-xs opacity-40">
        <a href="https://github.com/dimona/workstreams" target="_blank" class="hover:underline underline-offset-2">
          Docs
          <svg class="w-3 h-3 ml-1 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7h-2.875c5.523-3.366 5.523-8.8 0-12.166C15.523-8.8 9.523-8.8 4-12.166S2.477-8.8 1.125-5.125L12 2z"/>
          </svg>
        </a>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="ml-28 overflow-y-auto min-h-screen">
    <div id="page-content" class="p-6 md:p-8">
      <!-- Default home view -->
      <div class="hidden" id="home-view">
        <h1 class="text-2xl font-bold mb-4">Workstreams Web Console</h1>
        <p class="text-muted-foreground">Select a navigation item to view dashboard screens.</p>
        <p class="mt-4">
          <a href="screens/monitor.html" class="text-primary underline">Monitor</a> |
          <a href="screens/events.html" class="text-primary underline">Events</a> |
          <a href="screens/workstreams.html" class="text-primary underline">Workstreams</a> |
          <a href="screens/settings.html" class="text-primary underline">Settings</a>
        </p>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Navigation switching - load screen content
      const navButtons = document.querySelectorAll('[data-nav]');
      const pageContent = document.getElementById('page-content');

      navButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          // Remove active class from all buttons
          navButtons.forEach(b => b.classList.remove('opacity-100', 'text-primary'));
          
          // Add active class to clicked button
          btn.classList.add('opacity-100', 'text-primary');

          // Hide home view
          const homeView = document.getElementById('home-view');
          if (homeView) homeView.classList.add('hidden');

          const nav = btn.getAttribute('data-nav');
          // Load the selected screen (relative: served by `workstreams web`)
          fetch(`screens/${nav}.html`)
            .then(response => {
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              return response.text();
            })
            .then(html => {
              pageContent.innerHTML = html;
              // Remove 'hidden' class from the screen content that gets loaded
              const loadedScreen = pageContent.querySelector('.screen-view');
              if (loadedScreen) loadedScreen.classList.remove('hidden');
              if (window.WorkstreamsWeb) window.WorkstreamsWeb.onScreenLoaded(nav);
            })
            .catch(err => {
              pageContent.innerHTML = `<p class="text-rose-500">Error loading screen: ${err.message}</p>`;
            });
        });
      });

      // Set default active navigation (Monitor)
      const defaultNav = document.querySelector('[data-nav="monitor"]');
      if (defaultNav) {
        defaultNav.click();
      }
    });
  </script>

</body>
</html>
