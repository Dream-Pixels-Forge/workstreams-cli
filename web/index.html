<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workstreams Web Console</title>
  <meta name="description" content="Live console for the workstreams CLI — dispatch subagents, monitor worktrees, events and config.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23b8ff47'/><rect x='2' y='2' width='12' height='12' fill='%23111418'/><rect x='4' y='7' width='6' height='2' fill='%23b8ff47'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-surface text-on-surface font-sans">

  <!-- Top Utility Bar (56px) -->
  <header class="fixed top-0 inset-x-0 z-50 h-14 bg-surface-low border-b border-surface-highest flex items-center justify-between px-6">
    <!-- Repository selector -->
    <div class="flex items-center gap-2 bg-surface-container border border-surface-highest px-3 py-1.5">
      <svg class="w-4 h-4 text-on-surface-variant" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
      </svg>
      <span id="header-project" class="font-mono text-[13px] font-bold text-on-surface">workstreams</span>
      <span id="header-path" class="hidden sm:inline font-mono text-xs text-on-surface-variant bg-surface-lowest border border-surface-highest px-1.5 py-px">—</span>
      <svg class="w-4 h-4 text-on-surface-variant" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>

    <div class="flex items-center gap-4">
      <!-- LIVE status + poll switcher -->
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5 bg-surface-lowest border border-border-strong px-2.5 py-[3px]">
          <span class="w-1.5 h-1.5 bg-primary-fixed animate-pulse"></span>
          <span class="font-mono text-[10px] font-bold tracking-[0.08em] text-primary-fixed">LIVE</span>
        </span>
        <span class="font-mono text-[10px] tracking-[0.06em] text-caption" id="header-updated">connecting…</span>
        <span class="inline-flex items-center gap-1 bg-surface-container border border-surface-highest px-2 py-[3px] font-mono text-[10px] text-on-surface" title="Poll interval">2s</span>
      </div>

      <span class="w-px h-4 bg-surface-highest"></span>

      <!-- Alerts + avatar -->
      <div class="flex items-center gap-3">
        <button id="header-alerts-btn" class="relative p-1.5 text-on-surface-variant hover:text-on-surface hover:bg-surface-high transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary" aria-label="Alert notifications: 0 active">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a2.032 2.032 0 00-1.421-1.825l-1.41 1.41m0 0L15.17 10.7m-1.41 1.41l-4.578 4.568A2.032 2.032 0 018 16.158V13a6 6 0 016-6v0"/>
          </svg>
          <span id="header-alerts" class="absolute top-0 right-0 min-w-3.5 h-3.5 px-0.5 bg-primary-fixed text-on-primary-container font-mono text-[9px] font-bold flex items-center justify-center">0</span>
        </button>
        <div class="w-8 h-8 bg-primary-fixed text-on-primary-container font-mono text-xs font-bold flex items-center justify-center" title="User">UH</div>
      </div>
    </div>
  </header>

  <!-- Left Navigation Rail (220px) -->
  <aside class="fixed left-0 top-14 bottom-0 w-[220px] bg-surface-low border-r border-surface-highest z-40 flex flex-col justify-between p-2" aria-label="Main navigation">
    <!-- Wordmark -->
    <div class="flex items-center gap-2.5 px-3 py-3">
      <span class="w-6 h-6 bg-surface-highest border border-border-strong flex items-center justify-center">
        <svg class="w-3.5 h-3.5 text-primary-fixed" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2.5" d="M5 7l5 5-5 5m7 0h7"/>
        </svg>
      </span>
      <span class="font-mono text-base font-bold tracking-tight text-primary lowercase">workstreams</span>
    </div>

    <!-- Primary Navigation Links -->
    <nav class="flex flex-col gap-1 w-full">
      <button data-nav="monitor" class="w-full flex items-center gap-3 px-4 py-2.5 font-mono text-[11px] font-medium tracking-[0.06em] uppercase transition-colors hover:bg-surface-high hover:text-on-surface">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10Z"/>
        </svg>
        <span>Monitor</span>
      </button>

      <button data-nav="events" class="w-full flex items-center gap-3 px-4 py-2.5 font-mono text-[11px] font-medium tracking-[0.06em] uppercase transition-colors hover:bg-surface-high hover:text-on-surface">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M4 12h4l3-8 4 16 3-8h4"/>
        </svg>
        <span>Events</span>
      </button>

      <button data-nav="workstreams" class="w-full flex items-center gap-3 px-4 py-2.5 font-mono text-[11px] font-medium tracking-[0.06em] uppercase transition-colors hover:bg-surface-high hover:text-on-surface">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M4 6h7M4 12h16M4 18h7M17 6v12m0 0l-3-3m3 3l3-3"/>
        </svg>
        <span>Workstreams</span>
      </button>

      <button data-nav="settings" class="w-full flex items-center gap-3 px-4 py-2.5 font-mono text-[11px] font-medium tracking-[0.06em] uppercase transition-colors hover:bg-surface-high hover:text-on-surface">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
          <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 3.68 1.65 1.65 0 0010 2.17V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 8v.09a1.65 1.65 0 001.51 1H22a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </button>
    </nav>

    <!-- Footer Link -->
    <div class="border-t border-surface-highest pt-2">
        <a href="https://github.com/Dream-Pixels-Forge/workstreams-cli" target="_blank" rel="noopener" class="flex items-center justify-between px-4 py-2.5 font-mono text-[11px] font-medium tracking-[0.06em] uppercase text-on-surface-variant hover:bg-surface-high hover:text-on-surface transition-colors">
        <span class="flex items-center gap-3">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 016.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z"/>
          </svg>
          <span>Docs</span>
        </span>
        <svg class="w-3.5 h-3.5 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M7 17L17 7m0 0H8m9 0v9"/>
        </svg>
      </a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="pl-[220px]">
    <main class="pt-14 min-h-screen">
      <div id="page-content" class="p-6">
        <!-- Default home view -->
        <div class="hidden" id="home-view">
          <h1 class="font-mono text-2xl font-bold mb-4">Workstreams Web Console</h1>
          <p class="text-on-surface-variant">Select a navigation item to view dashboard screens.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navButtons = document.querySelectorAll('[data-nav]');
      const pageContent = document.getElementById('page-content');

      function setActive(btn) {
        navButtons.forEach(b => {
          const on = b === btn;
          b.classList.toggle('bg-surface-container', on);
          b.classList.toggle('text-primary', on);
          b.classList.toggle('font-bold', on);
          b.classList.toggle('border-l-2', on);
          b.classList.toggle('border-primary-fixed', on);
          b.classList.toggle('text-on-surface-variant', !on);
          if (on) b.setAttribute('aria-current', 'page');
          else b.removeAttribute('aria-current');
        });
      }

      navButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          setActive(btn);
          const homeView = document.getElementById('home-view');
          if (homeView) homeView.classList.add('hidden');

          const nav = btn.getAttribute('data-nav');
          fetch(`screens/${nav}.html`)
            .then(response => {
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              return response.text();
            })
            .then(html => {
              pageContent.innerHTML = html;
              const loadedScreen = pageContent.querySelector('.screen-view');
              if (loadedScreen) loadedScreen.classList.remove('hidden');
              if (window.WorkstreamsWeb) window.WorkstreamsWeb.onScreenLoaded(nav);
            })
            .catch(err => {
              pageContent.innerHTML = `<p class="text-danger code-stream">Error loading screen: ${err.message}</p>`;
            });
        });
      });

      // Shared click delegation for screen-internal interactions (tabs, table rows)
      pageContent.addEventListener('click', (ev) => {
        const tab = ev.target.closest('[data-inspect-tab]');
        if (tab && window.WorkstreamsWeb) {
          window.WorkstreamsWeb.setInspectorTab(tab.getAttribute('data-inspect-tab'));
          return;
        }
        const row = ev.target.closest('tr[data-ws-id]');
        if (row && window.WorkstreamsWeb) {
          window.WorkstreamsWeb.focusWorkstream(parseInt(row.getAttribute('data-ws-id'), 10));
        }
      });

      const defaultNav = document.querySelector('[data-nav="monitor"]');
      if (defaultNav) defaultNav.click();
    });
  </script>

</body>
</html>
